ignoreWorkspaceRootCheck: true
catalogMode: manual
cleanupUnusedCatalogs: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - js-base64@3.9.4

trustPolicy: no-downgrade
autoInstallPeers: false

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - '@types/markdown-it'
    - '@types/react'
    - react
    - react-dom

strictPeerDependencies: false

hoistPattern:
  - '*'

publicHoistPattern:
  - '*'

shellEmulator: true

packages:
  - api
  - docs
  - demo/*
  - demo/custom/valaxy-theme-custom
  - packages/*
  - packages/@valaxyjs/*
  - scripts

overrides:
  # Keep core toolchain versions consistent across workspace peer resolutions
  chokidar: 5.0.0
  semver: '7'
  unocss: 66.10.5
  vite: catalog:build
  vue: catalog:frontend

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  protobufjs: false
  vue-demi: true

