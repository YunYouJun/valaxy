# Keep this path for packages whose npm trusted publisher names release-addon.yml.
name: Release Addon
run-name: Publish addon ${{ inputs.addon }} via release-addon.yml

on:
  workflow_dispatch:
    inputs:
      addon:
        description: Addon trusted for release-addon.yml (e.g. meting); omit the valaxy-addon- prefix
        required: true
        type: string

permissions: {}

jobs:
  release-addon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Resolve addon name
        id: addon
        env:
          ADDON_INPUT: ${{ inputs.addon }}
        run: |
          if [[ ! "$ADDON_INPUT" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::Invalid addon name: $ADDON_INPUT"
            exit 1
          fi
          PACKAGE_DIR="packages/valaxy-addon-$ADDON_INPUT"
          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "::error::Package directory ${PACKAGE_DIR} not found"
            exit 1
          fi
          echo "dir=${PACKAGE_DIR}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Publish addon to npm
        working-directory: ${{ steps.addon.outputs.dir }}
        run: |
          PACKAGE_LABEL=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if pnpm publish --access public --no-git-checks; then
            echo "Published ${PACKAGE_LABEL} via release-addon.yml (no environment)." >> "$GITHUB_STEP_SUMMARY"
          else
            PUBLISH_STATUS=$?
            echo "::error::Failed to publish ${PACKAGE_LABEL}. For OIDC authentication errors, check npm's trusted publisher for YunYouJun/valaxy, workflow release-addon.yml, with no environment."
            echo "Failed to publish ${PACKAGE_LABEL} via release-addon.yml (no environment). See the publish log above for the cause." >> "$GITHUB_STEP_SUMMARY"
            exit "$PUBLISH_STATUS"
          fi
