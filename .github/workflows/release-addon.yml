name: Release Addon

on:
  push:
    branches:
      - main
    paths:
      - 'packages/valaxy-addon-*/package.json'
  workflow_dispatch:
    inputs:
      addon:
        description: 'Addon name (e.g. meting, waline)'
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  release-addon:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release(addon-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve addon name
        id: addon
        env:
          ADDON_INPUT: ${{ github.event.inputs.addon }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$ADDON_INPUT" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]]; then
              echo "::error::Invalid addon name: $ADDON_INPUT"
              exit 1
            fi
            ADDON_NAME="addon-$ADDON_INPUT"
          else
            # Extract addon name from: release(addon-xxx): ...
            PATTERN='release\((addon-[^)]+)\)'
            if [[ "$COMMIT_MSG" =~ $PATTERN ]]; then
              ADDON_NAME="${BASH_REMATCH[1]}"
            else
              echo "::error::Commit message does not match release(addon-*) pattern"
              exit 1
            fi
          fi
          PACKAGE_DIR="packages/valaxy-${ADDON_NAME}"
          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "::error::Package directory ${PACKAGE_DIR} not found"
            exit 1
          fi
          echo "name=${ADDON_NAME}" >> "$GITHUB_OUTPUT"
          echo "addon=${ADDON_NAME#addon-}" >> "$GITHUB_OUTPUT"
          echo "dir=${PACKAGE_DIR}" >> "$GITHUB_OUTPUT"
          echo "📦 Dispatching valaxy-${ADDON_NAME} from ${PACKAGE_DIR}"

      # npm permits only one trusted publisher per package. Dispatch the sole
      # OIDC-enabled publishing workflow instead of publishing from this file.
      - name: Dispatch trusted release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON_NAME: ${{ steps.addon.outputs.addon }}
        run: gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f addon="$ADDON_NAME"
