name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compute ESLint cache key
        id: eslint-cache-key
        # Hash manifests before install so node_modules/**/package.json is not included.
        run: echo "prefix=${{ runner.os }}-eslint-${{ hashFiles('eslint.config.js', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/package.json') }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-workspace

      - name: Validate addon catalog and docs
        run: pnpm run validate:addons

      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: ${{ steps.eslint-cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.eslint-cache-key.outputs.prefix }}-

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        # Root tsconfig resolves @valaxyjs/devtools* from source, so only utils and valaxy dists are needed.
        run: pnpm run build:@valaxyjs/utils && pnpm run build:valaxy && pnpm run typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [22.12.0, lts/*]
        os: [ubuntu-latest, windows-latest]
        exclude:
          - os: windows-latest
            node-version: 22.12.0
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}

      # for test check build dist
      - name: Build
        run: pnpm run build

      - name: Build and test demo dist
        if: matrix.os == 'windows-latest' || matrix.node-version == '22.12.0'
        run: pnpm run build:demo && pnpm run test:demo

      - run: pnpm run test -- --run

  # see playwright.yml
  # test-e2e
