name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e-packages:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          skip-playwright-download: 'true'

      - uses: ./.github/actions/setup-playwright

      - name: Build Core Packages
        run: pnpm run build

      - name: Test addon marketplace with isolated package installation
        run: pnpm run test:devtools

      - name: Test TypeDoc addon from packed release artifacts
        run: node scripts/check-typedoc-package.mjs

      - name: Test Fuse search from packed release artifacts
        run: node scripts/check-fuse-package.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-packages
          path: |
            test-results/devtools-addons/
            test-results/typedoc-package/
          if-no-files-found: ignore
          retention-days: 30

  e2e-theme-yun:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          skip-playwright-download: 'true'

      - uses: ./.github/actions/setup-playwright

      - name: CI Build Init
        run: pnpm run ci

      - name: Build Demo Dist
        run: pnpm run build:demo

      - name: Verify Demo Dist
        run: pnpm run test:demo

      - name: Run Theme Yun & Valaxy Playwright tests
        run: PLAYWRIGHT_SUITE=yun pnpm exec playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-yun
          path: playwright-report/
          retention-days: 30

  e2e-docs:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          skip-playwright-download: 'true'

      - uses: ./.github/actions/setup-playwright

      - name: Build Core Packages
        run: pnpm run build

      - name: Build Docs SSG
        run: node scripts/measure-docs-build.mjs test-results/docs-build docs:build

      - name: Verify unified API links
        run: pnpm run verify:api

      - name: Run Docs SSG Playwright tests
        run: pnpm run e2e:ssg

      - name: Run Docs Dev Playwright tests
        run: PLAYWRIGHT_SUITE=docs pnpm exec playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-docs
          path: |
            playwright-report/
            playwright-report-ssg/
            test-results-ssg/
            test-results/docs-build/
          retention-days: 30
