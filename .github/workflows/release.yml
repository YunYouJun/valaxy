name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'packages/valaxy-addon-*/package.json'
  workflow_dispatch:
    inputs:
      addon:
        description: Addon name or theme-yun; for meting use Release Addon
        required: true
        type: string

permissions: {}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Verify coordinated release before publishing
        run: pnpm run check:release

      # https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
      # v1 release candidates are the default install channel while v1 is being
      # finalized. Other prereleases continue to use `next`.
      - name: Publish release to npm
        run: |
          # Addons have independent versions and their own release job. Publish
          # the coordinated core packages first, before any new addon depends on them.
          PACKAGES=(--filter @valaxyjs/utils --filter @valaxyjs/devtools --filter create-valaxy --filter valaxy --filter valaxy-theme-press --filter valaxy-theme-yun)
          if [[ "$GITHUB_REF_NAME" == v1.0.0-rc.* ]]; then
            pnpm -r "${PACKAGES[@]}" publish --access public --no-git-checks --tag latest
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            pnpm -r "${PACKAGES[@]}" publish --access public --no-git-checks --tag next
          else
            pnpm -r "${PACKAGES[@]}" publish --access public --no-git-checks
          fi
        env:
          PNPM_CONFIG_BAIL: 'false'

      - name: Publish GitHub release notes
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes" ]]; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" "${flags[@]}"
          else
            npx changelogithub
          fi
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  deploy-mirrors:
    needs: release
    if: github.repository == 'YunYouJun/valaxy'
    runs-on: ubuntu-latest
    environment: edgeone-production
    concurrency:
      group: edgeone-production
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify published release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .published_at != null) | .tag_name')"
          if ! grep -Fxq -- "$RELEASE_TAG" <<< "$published_tags"; then
            echo "::error::$RELEASE_TAG has no published GitHub release."
            exit 1
          fi

          # The old release branch rejected rollbacks through a fast-forward-only push.
          release_commit="$(git rev-parse HEAD)"
          for tag in $(git tag --contains HEAD 'v*'); do
            if [[ "$(git rev-parse "$tag^{commit}")" != "$release_commit" ]] &&
              grep -Fxq -- "$tag" <<< "$published_tags"; then
              echo "::notice::$RELEASE_TAG has been superseded by $tag."
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.verify.outputs.deploy == 'true'
        uses: pnpm/action-setup@v6

      - name: Use Node.js LTS
        if: steps.verify.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Build the sites from the release commit
        if: steps.verify.outputs.deploy == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:all
          pnpm docs:build
          pnpm demo:build
          cp -R demo/yun/edge-functions demo/yun/dist/
          printf '%s\n' '{"private":true,"type":"module"}' > demo/yun/dist/package.json

      - name: Deploy production sites to EdgeOne
        if: steps.verify.outputs.deploy == 'true'
        shell: bash
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          EDGEONE_PAGES_API_REGION: china
        run: |
          : "${EDGEONE_PAGES_API_TOKEN:?Configure EDGEONE_PAGES_API_TOKEN in the edgeone-production environment}"
          deploy() (
            cd "$1"
            pnpm dlx edgeone@1.7.6 makers deploy . --name "$2" --env production --skip-ai-gateway-sync --json |
              sed -E 's@\?[^"[:space:]]+@[query omitted]@g'
          )
          deploy docs/dist yunyoujun-valaxy-upload
          deploy demo/yun/dist yunyoujun-valaxy-yun-upload

  release-addon:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release(addon-')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Resolve package name
        id: addon
        env:
          ADDON_INPUT: ${{ inputs.addon }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$ADDON_INPUT" == "theme-yun" ]]; then
            PACKAGE_DIR="packages/valaxy-theme-yun"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$ADDON_INPUT" =~ ^[a-z0-9]+([a-z0-9-]*[a-z0-9])?$ ]]; then
              echo "::error::Invalid addon name: $ADDON_INPUT"
              exit 1
            fi
            ADDON_NAME="addon-$ADDON_INPUT"
          else
            # Extract addon name from: release(addon-xxx): ...
            PATTERN='release\((addon-[^)]+)\)'
            if [[ "$COMMIT_MSG" =~ $PATTERN ]]; then
              ADDON_NAME="${BASH_REMATCH[1]}"
            else
              echo "::error::Commit message does not match release(addon-*) pattern"
              exit 1
            fi
          fi
          if [[ -z "${PACKAGE_DIR:-}" ]]; then
            PACKAGE_DIR="packages/valaxy-${ADDON_NAME}"
          fi
          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "::error::Package directory ${PACKAGE_DIR} not found"
            exit 1
          fi
          if [[ "$PACKAGE_DIR" == "packages/valaxy-addon-meting" ]]; then
            echo "::error::Meting must use the Release Addon workflow (release-addon.yml)."
            exit 1
          fi
          echo "dir=${PACKAGE_DIR}" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing valaxy-${ADDON_NAME} from ${PACKAGE_DIR}"

      - run: pnpm install --frozen-lockfile

      - name: Publish package to npm
        working-directory: ${{ steps.addon.outputs.dir }}
        run: pnpm publish --access public --no-git-checks
        env:
          PNPM_CONFIG_BAIL: 'false'
