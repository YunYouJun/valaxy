name: Setup workspace
description: Install pnpm, Node.js, and workspace dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: lts/*
  skip-playwright-download:
    description: Skip Playwright browser download during install
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install
      if: inputs.skip-playwright-download != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install (skip Playwright browser download)
      if: inputs.skip-playwright-download == 'true'
      shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: pnpm install --frozen-lockfile
